name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Check generator syntax
        run: node --check scripts/generate.mjs
      - name: Test shared-source generation and drift rejection
        run: npm test
      - name: Verify committed generated content
        run: npm run check
      - name: Check published CLI freshness
        run: npm run release:check
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify and exercise published CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("content/cli-release.json")).version')
          archive="stack-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir "$RUNNER_TEMP/stack-release"
          gh release download "v${version}" --repo stack-sh/cli --pattern "$archive" --dir "$RUNNER_TEMP/stack-release"
          gh attestation verify "$RUNNER_TEMP/stack-release/$archive" --repo stack-sh/cli
          tar -xzf "$RUNNER_TEMP/stack-release/$archive" -C "$RUNNER_TEMP/stack-release"
          STACK_CLI_BIN="$RUNNER_TEMP/stack-release/stack-v${version}-x86_64-unknown-linux-gnu/stack" npm run smoke
