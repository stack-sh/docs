name: Consumer freshness

on:
  push:
    branches: [main]
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
      - run: npm run check
      - run: npm run consumers:check
